# Agents use service names on microgrid-net (e.g. https://solar-agent:8443/command).
services:

  redis:
    image: redis:7-alpine
    container_name: microgrid-redis
    ports:
      - "6379:6379"         # Exposed to host for debugging. Remove in production.
    networks:
      - microgrid-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: microgrid-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_DB=dev-file
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    ports:
      - "8080:8080"         # Keycloak admin interface
    networks:
      - microgrid-net
    restart: unless-stopped
    command: start-dev
    volumes:
      - keycloak-data:/opt/keycloak/data

  microgrid-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: microgrid-agent
    volumes:
      - ./microgrid_agent.py:/app/microgrid_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
      - ./audit_trail.db:/app/audit_trail.db
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGENT_FILE=microgrid_agent.py
      - AGENT_ID=microgrid-agent
      - AGENT_ROLE=control
      - AUDIT_DB_PATH=/app/audit_trail.db
      - ENABLE_LOCAL_INSTRUMENTATION=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
      # OIDC Configuration - switch between local Keycloak and Google Cloud
      - OIDC_ISSUER=${OIDC_ISSUER:-http://keycloak:8080/realms/microgrid}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-microgrid-agents}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - AUTH_MODE=${AUTH_MODE:-local}  # local (Keycloak) or cloud (Google)
    ports:
      - "8000:8000"
      - "8443:8443"
    depends_on:
      - redis
    networks:
      - microgrid-net
    restart: unless-stopped

  control-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: control-agent
    volumes:
      - ./control_agent.py:/app/control_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
      - ./audit_trail.db:/app/audit_trail.db
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGENT_FILE=control_agent.py
      - AGENT_ID=control-agent
      - AGENT_ROLE=control
      - AUDIT_DB_PATH=/app/audit_trail.db
      - ENABLE_LOCAL_INSTRUMENTATION=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
      # OIDC Configuration - switch between local Keycloak and Google Cloud
      - OIDC_ISSUER=${OIDC_ISSUER:-http://keycloak:8080/realms/microgrid}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-microgrid-agents}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - AUTH_MODE=${AUTH_MODE:-local}  # local (Keycloak) or cloud (Google)
    ports:
      - "8001:8000"
      - "8444:8443"
    depends_on:
      - redis
    networks:
      - microgrid-net
    restart: unless-stopped

  monitor-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: monitor-agent
    volumes:
      - ./monitor_agent.py:/app/monitor_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
      - ./audit_trail.db:/app/audit_trail.db
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGENT_FILE=monitor_agent.py
      - AGENT_ID=monitor-agent
      - AGENT_ROLE=monitor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
      - AUDIT_DB_PATH=/app/audit_trail.db
      - ENABLE_LOCAL_INSTRUMENTATION=true
      - OIDC_ISSUER=${OIDC_ISSUER:-http://keycloak:8080/realms/microgrid}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-microgrid-agents}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - AUTH_MODE=${AUTH_MODE:-local}
    ports:
      - "8006:8000"
      - "8446:8443"
    depends_on:
      - redis
      - control-agent
    networks:
      - microgrid-net
    restart: unless-stopped

  researcher-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: researcher-agent
    volumes:
      - ./research_agent.py:/app/research_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
      - ./audit_trail.db:/app/audit_trail.db
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGENT_FILE=research_agent.py
      - AGENT_ID=researcher-agent
      - AGENT_ROLE=researcher
      - AUDIT_DB_PATH=/app/audit_trail.db
      - ENABLE_LOCAL_INSTRUMENTATION=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
      # OIDC Configuration - switch between local Keycloak and Google Cloud
      - OIDC_ISSUER=${OIDC_ISSUER:-http://keycloak:8080/realms/microgrid}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-microgrid-agents}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - AUTH_MODE=${AUTH_MODE:-local}  # local (Keycloak) or cloud (Google)
    ports:
      - "8002:8000"
      - "8445:8443"
    depends_on:
      - redis
    networks:
      - microgrid-net
    restart: unless-stopped

