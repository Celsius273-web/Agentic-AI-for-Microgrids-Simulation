# Microgrid Agent System - Docker Compose File 
# All agents share the same Redis service and mTLS certificates.
# Agents communicate over the internal "microgrid-net" network using service names as hostnames.
# e.g. control-agent calls http://solar-agent:8000/command
services:

  redis:
    image: redis:7-alpine
    container_name: microgrid-redis
    ports:
      - "6379:6379"         # Exposed to host for debugging. Remove in production.
    networks:
      - microgrid-net
    restart: unless-stopped

  microgrid-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: microgrid-agent
    volumes:
      - ./microgrid_agent.py:/app/microgrid_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AGENT_FILE=microgrid_agent.py
      - AGENT_ID=microgrid-agent
      - AGENT_ROLE=control
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
    ports:
      - "8000:8000"
      - "8443:8443"
    depends_on:
      - redis
    networks:
      - microgrid-net
    restart: unless-stopped

  control-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: control-agent
    volumes:
      - ./control_agent.py:/app/control_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AGENT_FILE=control_agent.py
      - AGENT_ID=control-agent
      - AGENT_ROLE=control
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
    ports:
      - "8001:8000"
      - "8444:8443"
    depends_on:
      - redis
    networks:
      - microgrid-net
    restart: unless-stopped

  researcher-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: researcher-agent
    volumes:
      - ./research_agent.py:/app/research_agent.py
      - ./shared:/app/shared
      - ./shared/certs:/app/shared/certs:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AGENT_FILE=research_agent.py
      - AGENT_ID=researcher-agent
      - AGENT_ROLE=researcher
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CERTS_DIR=/app/shared/certs
      - ENABLE_MTLS=true
      - VERIFY_PEER_CERTS=true
      - MTLS_SERVER_PORT=8443
    ports:
      - "8002:8000"
      - "8445:8443"
    depends_on:
      - redis
    networks:
      - microgrid-net
    restart: unless-stopped

